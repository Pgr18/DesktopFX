plugins {
    id 'application'
    alias(libs.plugins.javamodularity.moduleplugin)
    alias(libs.plugins.javafxplugin)
    alias(libs.plugins.springframework.boot)
    alias(libs.plugins.spring.dependency.management)
}

dependencies {
    implementation project(':FxCore')
    implementation project(':Communication')
    implementation project(':Util')
    implementation libs.findbugs.jsr305
    implementation libs.jspecify
    implementation libs.inject.api
    implementation libs.measure.unit.api
    implementation libs.tech.units
    implementation libs.commons.math3
    // Needed on JPMS module-path: spring.context (automatic) loads LogFactory at startup
    implementation 'commons-logging:commons-logging'

    implementation libs.javafx.base
    implementation libs.javafx.graphics

    implementation(platform(libs.spring.bom))
    implementation libs.bundles.spring.boot

    //    https://github.com/junit-team/junit5/issues/1773
    testImplementation libs.junit.jupiter.api
    testImplementation libs.assertj
    testRuntimeOnly libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.controls', 'javafx.fxml']
    configurations = ['implementation']
}

application {
    mainModule = 'com.ak.fx.desktop'
    mainClass = 'com.ak.spring.SpringFxApplication'
    applicationDefaultJvmArgs = ['--enable-preview']
}

def activeProfile = findProperty('profile') ?: System.getenv('SPRING_PROFILES_ACTIVE')

tasks {
    test {
        moduleOptions {
            runOnClasspath = true
        }
    }

    run {
        // Ensure transitive automatic modules (commons.logging for Spring) are resolved
        moduleOptions {
            addModules = ['org.apache.commons.logging', 'ALL-MODULE-PATH']
        }
        jvmArgs '--enable-preview'
        if (activeProfile) {
            systemProperty 'spring.profiles.active', activeProfile
            environment 'SPRING_PROFILES_ACTIVE', activeProfile.toString()
        }
    }

    bootRun {
        jvmArgs '--enable-preview'
        if (activeProfile) {
            systemProperty 'spring.profiles.active', activeProfile
            environment 'SPRING_PROFILES_ACTIVE', activeProfile.toString()
        }
    }
}